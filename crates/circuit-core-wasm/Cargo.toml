[package]
name = "circuit-core-wasm"
description = "wasm-bindgen facade over circuit-core, published as the npm package @tutor/core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser loads the JSON registry bundle, so the YAML/SVG source loaders are left out.
circuit-core = { path = "../circuit-core", default-features = false }
wasm-bindgen = "0.2.129"
