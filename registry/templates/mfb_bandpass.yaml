id: mfb_bandpass
version: 1
role: filter
title: Active band-pass (multiple feedback)
teach: "Passes a band around f0 and attenuates both sides; Q = f0 / bandwidth. Unity gain at f0, inverted."
targets:
  f0_hz: {label: Centre frequency, unit: hertz, min: 20, max: 2k, default: 1k, scale: log}
  q: {label: Q, unit: unitless, min: 1, max: 4, default: "2", scale: log}
ports: {in: input, out: output, vcc: power_pos, vee: power_neg, gnd: ground}
rails:
  vcc: {net: VCC, volts: 12, min: 9, max: 15}
  vee: {net: VEE, volts: -12, min: -15, max: -9}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  R3: {part: resistor_th}
  C1: {part: cap_film}
  C2: {part: cap_film}
  U1: {part: opamp_tl072}
nets:
  in: [R1.1]
  n_a: [R1.2, R2.1, C1.1, C2.1]
  n_m: [C1.2, R3.1, U1.INM_A]
  out: [C2.2, R3.2, U1.OUT_A]
  gnd: [R2.2, U1.INP_A]
  vcc: [U1.VCC]
  vee: [U1.VEE]
solver: mfb_bandpass
checks:
  - {name: f0_hz, label: Centre frequency, symbol: "f0", kind: ac_center, out: out, tol_pct: 10}
  - {name: q, label: Q, symbol: "Q", kind: ac_band_q, out: out, tol_pct: 15}
verify:
  drive: {in: {amplitude: 0.5, frequency: 1k}}
  load: {out: 10k}
