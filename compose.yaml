# Local stack (LLD §2 deployables): `docker compose up -d --build`.
# The simulation worker sits on an internal network with Redis only: no route out (LLD §8, §14).
name: circuit-forge

services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379", "[::1]:6379:6379"]  # loopback only: Redis has no password here
    networks: [default, sim]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim_runner:
    build:
      context: .
      dockerfile: workers/sim_runner/Dockerfile
    image: ${SIM_RUNNER_IMAGE:-circuit-forge/sim-runner:dev}
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    networks: [sim]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]  # per-job deck directories, and ngspice's tmpfile()
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

networks:
  sim:
    internal: true
