id: led_flasher
version: 1
role: oscillator
title: LED flasher (555)
teach: "A 555 astable slow enough to see: C1 charges through R1 + R2 and discharges through R2, and the output lights D1 through R3 on each high half."
targets:
  freq_hz: {label: Blink rate, unit: hertz, min: 0.5, max: 20, default: "2", scale: log}
ports: {out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: VCC, volts: 9, min: 6, max: 15}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  R3: {part: resistor_th}
  C1: {part: cap_film}
  C2: {part: cap_film}
  D1: {part: led_red}
  U1: {part: timer_ne555}
nets:
  vcc: [R1.1, U1.VCC, U1.RESET]
  n_dis: [R1.2, R2.1, U1.DIS]
  n_thr: [R2.2, C1.1, U1.THR, U1.TRIG]
  n_ctrl: [C2.1, U1.CTRL]
  out: [U1.OUT, R3.1]
  n_led: [R3.2, D1.A]
  gnd: [C1.2, C2.2, U1.GND, D1.K]
solver: led_flasher
checks:
  - {name: freq_hz, label: Blink rate, symbol: "f", kind: tran_freq, out: out, tol_pct: 10}
  - {name: duty, label: Time on, symbol: "duty", kind: tran_duty, out: out, tol_pct: 10}
