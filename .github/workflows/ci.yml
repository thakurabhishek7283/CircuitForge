name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ngspice:
    name: ngspice (native + WASM, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both builds take minutes and change only with the pin, the scripts or the patches.
      - uses: actions/cache@v4
        with:
          path: third_party/ngspice/dist
          key: ngspice-dist-${{ hashFiles('third_party/ngspice/pin.env', 'third_party/ngspice/*.sh', 'third_party/ngspice/patches/**') }}
      - name: Native ngspice (pinned source; the sim_runner engine)
        run: bash third_party/ngspice/build-native.sh
      - name: ngspice WASM (pinned emsdk image; the browser engine)
        run: bash third_party/ngspice/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ngspice-dist
          path: third_party/ngspice/dist
          include-hidden-files: true
          retention-days: 7

  core:
    name: circuit-core, bindings, parity, codegen, simulation
    needs: ngspice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack

      - name: Python env
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv maturin pytest "pydantic>=2.9,<3" -e "workers/sim_runner[test]" -e "apps/api[test]"
          echo "PYO3_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast
      - name: Core builds without the YAML/SVG source loaders (WASM configuration)
        run: cargo build -p circuit-core --no-default-features

      - name: Cross-runtime parity (native vs WASM vs PyO3)
        run: bash tools/parity/run.sh 1000
      - name: Binding tests
        run: |
          node --test crates/circuit-core-wasm/tests/core.test.mjs
          .venv/bin/python -m pytest -q crates/circuit-core-py/tests

      - name: Generated code is up to date
        run: bash tools/codegen/run.sh --check
      - name: Generated models accept core output
        run: .venv/bin/python -m pytest -q tools/codegen

      # Uses the bindings and the registry bundle built by the parity step above.
      - uses: actions/download-artifact@v4
        with:
          name: ngspice-dist
          path: third_party/ngspice/dist
      # Also verifies every block template at 5 points and stamps the bundle (verified.json).
      - name: Simulation tests (every part, every template, demo circuit, native vs WASM parity)
        env:
          REQUIRE_NGSPICE: "1"
        run: |
          chmod +x third_party/ngspice/dist/native/bin/*
          .venv/bin/python -m pytest -q tools/sim
      # The worker on Redis 7 (testcontainers; Docker is on the runner) with the sandbox rlimits.
      - name: sim_runner worker (queue, cache, refusals, limits)
        env:
          REQUIRE_NGSPICE: "1"
          REQUIRE_DOCKER: "1"
        run: .venv/bin/python -m pytest -q workers/sim_runner/tests
      # The API on Postgres 16 + pgvector and Redis 7 (testcontainers), served by uvicorn; the
      # orchestrator's jobs replay recorded model replies and simulate on the sim_runner worker.
      - name: API (projects, op log, jobs, SSE stream, reaper, tenancy, orchestrator)
        env:
          REQUIRE_DOCKER: "1"
          REQUIRE_NGSPICE: "1"
        run: .venv/bin/python -m pytest -q apps/api/tests
      - name: circuit-core browser build (@tutor/core for Vite)
        run: node crates/circuit-core-wasm/build.mjs
      # Store, layout, schematic and sim worker against the real core, registry bundle and
      # ngspice.wasm; then the static bundle (app + ngspice + registry) a CDN would serve, which
      # ships only a registry bundle the template verification above stamped.
      - name: Web app
        working-directory: apps/web
        env:
          REQUIRE_NGSPICE: "1"
          REQUIRE_VERIFIED: "1"
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
      # The editing flows in a real browser, on the bundle just built, with the API down; then the
      # generation flows against the real API (tools/e2e/stack.py: Postgres and Redis in Docker, the
      # sim worker on the native ngspice, scripted model replies). Edge is preinstalled on the
      # Ubuntu runners, so no browser is downloaded.
      - name: Browser tests (Playwright on the runner's Edge; editing offline, generation on the API)
        working-directory: apps/web
        run: |
          microsoft-edge --version
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  images:
    name: images (sim_runner, api) and the local stack
    runs-on: ubuntu-latest
    env:
      SIM_RUNNER_IMAGE: circuit-forge/sim-runner:ci
      API_IMAGE: circuit-forge/api:ci
      AUTH_TOKEN_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      LLM_PROVIDER: fake  # apps/api/fake/script.json, mounted by compose: no network calls
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: sim_runner image (ngspice from the pinned source)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: workers/sim_runner/Dockerfile
          tags: circuit-forge/sim-runner:ci
          load: true
          push: false
          cache-from: type=gha,scope=sim-runner
          cache-to: type=gha,mode=max,scope=sim-runner
      - name: api image (circuit-core wheel built with maturin)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: circuit-forge/api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: sim_runner selftest under the production sandbox (read-only, no network, tmpfs, no capabilities)
        run: >-
          docker run --rm --read-only --network none --tmpfs /tmp:size=512m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          circuit-forge/sim-runner:ci python -m sim_runner.selftest
      - name: Stack starts (Postgres, Redis, migrations, API, worker) and the API answers
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 api sim_runner
          token=$(curl -sf -X POST http://127.0.0.1:8000/v1/auth/anonymous | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          project=$(curl -sf -X POST -H "Authorization: Bearer $token" http://127.0.0.1:8000/v1/projects | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -H "Authorization: Bearer $token" "http://127.0.0.1:8000/v1/projects/$project" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["circuit"]["rev"] == 0, s'
          curl -sf http://127.0.0.1:8000/readyz
      # A scripted generation through the containers: the LLM settings and the fake script reach
      # the read-only API, and the sandboxed worker simulates every block's bench.
      - name: A generation job runs through the stack (LLM_PROVIDER=fake)
        run: |
          auth="Authorization: Bearer $(curl -sf -X POST http://127.0.0.1:8000/v1/auth/anonymous | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          project=$(curl -sf -X POST -H "$auth" http://127.0.0.1:8000/v1/projects | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          job=$(curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' -d '{"prompt": "a filtered test signal"}'             "http://127.0.0.1:8000/v1/projects/$project/generate" | python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')
          curl -sf --max-time 60 -H "$auth" "http://127.0.0.1:8000/v1/jobs/$job/events" > events.txt
          grep '^event:' events.txt | sort | uniq -c
          tail -n 4 events.txt | grep -q '^event: done'
          curl -sf -H "$auth" "http://127.0.0.1:8000/v1/projects/$project" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert list(s["circuit"]["blocks"]) == ["b1", "b2", "b3"], s["circuit"]["blocks"]'
      - if: always()
        run: docker compose logs && docker compose down -v
