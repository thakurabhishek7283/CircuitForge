id: schmitt_trigger
version: 1
role: comparator
title: Schmitt trigger (inverting)
teach: "R3 feeds the output back to the threshold, so it moves once the output flips: two thresholds, and noise near one cannot make the output chatter."
targets:
  center_v: {label: Centre threshold, unit: volt, min: 2, max: 4, default: "3"}
  hyst_v: {label: Hysteresis, unit: volt, min: 0.3, max: 1.5, default: "1"}
ports: {in: input, out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: VCC, volts: 9, min: 9, max: 15}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  R3: {part: resistor_th}
  U1: {part: opamp_lm358}
nets:
  in: [U1.INM_A]
  n_p: [R1.2, R2.1, R3.1, U1.INP_A]
  out: [U1.OUT_A, R3.2]
  vcc: [R1.1, U1.VCC]
  gnd: [R2.2, U1.VEE]
solver: schmitt_trigger
checks:
  - {name: vth_hi_v, label: Upper threshold, symbol: "Vth+", kind: tran_threshold, in: in, out: out, edge: fall, tran: {stop: 20m, step: 2u}, tol_pct: 8}
  - {name: vth_lo_v, label: Lower threshold, symbol: "Vth−", kind: tran_threshold, in: in, out: out, edge: rise, tran: {stop: 20m, step: 2u}, tol_pct: 8}
verify:
  drive: {in: {amplitude: 2.5, offset: 3, frequency: 250}}
  load: {out: 10k}
