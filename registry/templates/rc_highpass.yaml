id: rc_highpass
version: 1
role: filter
title: RC high-pass filter
teach: "C blocks DC and low frequencies; above fc = 1/(2πRC) the signal passes. Also how audio stages are AC-coupled."
targets:
  fc_hz: {label: Cutoff frequency, unit: hertz, min: 10, max: 100k, default: 1k, scale: log}
ports: {in: input, out: output, gnd: ground}
parts:
  R1: {part: resistor_th}
  C1: {part: cap_film}
nets:
  in: [C1.1]
  out: [C1.2, R1.1]
  gnd: [R1.2]
solver: rc_first_order
checks:
  - {name: fc_hz, label: Cutoff (−3 dB), symbol: "fc", kind: ac_corner, out: out, pass: high, tol_pct: 10}
verify:
  drive: {in: {amplitude: 1, frequency: 10k}}
  load: {out: 1meg}
