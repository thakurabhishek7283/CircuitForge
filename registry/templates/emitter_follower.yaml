id: emitter_follower
version: 1
role: buffer
title: Emitter follower
teach: "The emitter follows the base about 0.65 V lower: gain just under 1, but the transistor supplies the output current."
ports: {in: input, out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: VCC, volts: 12, min: 9, max: 15}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  R3: {part: resistor_th}
  C1: {part: cap_film}
  C2: {part: cap_film}
  Q1: {part: npn_2n3904}
nets:
  in: [C1.1]
  n_b: [C1.2, R1.2, R2.1, Q1.B]
  vcc: [R1.1, Q1.C]
  n_e: [Q1.E, R3.1, C2.1]
  out: [C2.2]
  gnd: [R2.2, R3.2]
solver: emitter_follower
checks:
  - {name: gain, label: Gain at 1 kHz, symbol: "gain", kind: ac_gain, in: in, out: out, tol_pct: 5}
verify:
  drive: {in: {amplitude: 0.5, frequency: 1k}}
  load: {out: 10k}
