id: divider_bias
version: 1
role: bias
title: Voltage divider (bias)
teach: "Two resistors split the supply: Vout = Vcc·R2/(R1 + R2), as long as the load draws much less than the divider current."
targets:
  vout_v: {label: Output voltage, unit: volt, min: 0.5, max: 4.5, default: "2.5"}
ports: {out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: VCC, volts: 12, min: 5, max: 15}
parts:
  R1: {part: resistor_th}
  R2: {part: resistor_th}
nets:
  vcc: [R1.1]
  out: [R1.2, R2.1]
  gnd: [R2.2]
solver: divider_bias
checks:
  - {name: vout_v, label: Output voltage, symbol: "Vout", kind: dc_level, out: out, tol_pct: 3}
verify:
  load: {out: 1meg}
