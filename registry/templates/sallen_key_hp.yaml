id: sallen_key_hp
version: 1
role: filter
title: Sallen-Key high-pass (2nd order)
teach: "The low-pass with R and C swapped: below fc the output falls 40 dB/decade; R2/R1 sets Q."
targets:
  fc_hz: {label: Cutoff frequency, unit: hertz, min: 20, max: 5k, default: 1k, scale: log}
  q: {label: Q, unit: unitless, min: 0.5, max: 2, default: "0.707", scale: log}
ports: {in: input, out: output, vcc: power_pos, vee: power_neg, gnd: ground}
rails:
  vcc: {net: VCC, volts: 12, min: 9, max: 15}
  vee: {net: VEE, volts: -12, min: -15, max: -9}
parts:
  C1: {part: cap_film}
  C2: {part: cap_film}
  R1: {part: resistor_th}
  R2: {part: resistor_th}
  U1: {part: opamp_tl072}
nets:
  in: [C1.1]
  n_a: [C1.2, C2.1, R1.1]
  n_b: [C2.2, R2.1, U1.INP_A]
  out: [U1.OUT_A, U1.INM_A, R1.2]
  gnd: [R2.2]
  vcc: [U1.VCC]
  vee: [U1.VEE]
solver: sallen_key_hp
checks:
  - {name: fc_hz, label: Cutoff (−3 dB), symbol: "fc", kind: ac_corner, out: out, pass: high, tol_pct: 10}
  - {name: q, label: Q, symbol: "Q", kind: ac_q, out: out, pass: high, tol_pct: 15}
verify:
  drive: {in: {amplitude: 1, frequency: 10k}}
  load: {out: 10k}
