id: square_555
version: 1
role: oscillator
title: 555 square-wave oscillator
teach: "One resistor from the output does both jobs: C1 charges through R1 while the output is high and discharges through it while low, so the wave is nearly square."
targets:
  freq_hz: {label: Frequency, unit: hertz, min: 1, max: 5k, default: 1k, scale: log}
ports: {out: output, vcc: power_pos, gnd: ground}
rails:
  vcc: {net: VCC, volts: 9, min: 9, max: 15}
parts:
  R1: {part: resistor_th}
  C1: {part: cap_film}
  C2: {part: cap_film}
  U1: {part: timer_ne555}
nets:
  vcc: [U1.VCC, U1.RESET]
  out: [U1.OUT, R1.1]
  n_thr: [R1.2, C1.1, U1.THR, U1.TRIG]
  n_ctrl: [C2.1, U1.CTRL]
  gnd: [C1.2, C2.2, U1.GND, U1.DIS]
solver: square_555
checks:
  - {name: freq_hz, label: Frequency, symbol: "f", kind: tran_freq, out: out, tol_pct: 10}
  - {name: duty, label: Duty cycle, symbol: "duty", kind: tran_duty, out: out, tol_pct: 10}
verify:
  load: {out: 10k}
